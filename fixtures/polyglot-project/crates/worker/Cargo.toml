[package]
name = "worker"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
tracing-subscriber = "0.3"

[dev-dependencies]
proptest = "1.4"

[target.'cfg(unix)'.dependencies]
nix = "0.28"

[build-dependencies]
cc = "1"
